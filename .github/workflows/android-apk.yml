name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret is empty. Please add your google-services.json content as a repository secret named GOOGLE_SERVICES_JSON."
            echo "Falling back to a mock file for compilation purposes..."
            echo '{"project_info":{"project_number":"1","project_id":"mock","storage_bucket":"mock.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1:android:1","android_client_info":{"package_name":"com.aistudio.questionbank.v1.agqpby64"}},"api_key":[{"current_key":"mock"}]}]}' > app/google-services.json
          else
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi


      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
        env:
          APP_UPDATE_REPO: ${{ secrets.APP_UPDATE_REPO }}
          APP_UPDATE_TOKEN: ${{ secrets.APP_UPDATE_TOKEN }}
          APP_GITHUB_SHA: ${{ github.sha }}

      - name: Rename Release APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/QB4EnGby64-debug.apk || echo "Already renamed"
          ls -la app/build/outputs/apk/debug/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QB4EnGby64-Offline-APK
          path: app/build/outputs/apk/debug/QB4EnGby64-debug.apk

      - name: Update Latest Tag
        run: |
          gh release delete latest --cleanup-tag -y || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          make_latest: true
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/QB4EnGby64-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
