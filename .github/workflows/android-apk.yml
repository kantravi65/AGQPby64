name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret is empty. Please add your google-services.json content as a repository secret named GOOGLE_SERVICES_JSON."
            echo "Falling back to a mock file for compilation purposes..."
            echo '{"project_info":{"project_number":"1","project_id":"mock","storage_bucket":"mock.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1:android:1","android_client_info":{"package_name":"com.aistudio.questionbank.v1.zelcbr"}},"api_key":[{"current_key":"mock"}]}]}' > app/google-services.json
          else
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Setup Debug Keystore
        run: |
          echo "Writing hardcoded base64 keystore..."
          echo "" > debug.keystore.base64
          base64 -d debug.keystore.base64 > debug.keystore
          echo "Verifying SHA1..."
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep "SHA1"

      - name: Build Debug APK
        run: gradle assembleDebug
        env:
          APP_UPDATE_REPO: ${{ secrets.APP_UPDATE_REPO }}
          APP_UPDATE_TOKEN: ${{ secrets.APP_UPDATE_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QPby64-Offline-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Rename Release APKs
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/QPby64-debug.apk
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/QPby64-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
