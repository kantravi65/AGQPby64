name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug and Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace
        env:
          APP_UPDATE_REPO: ${{ secrets.APP_UPDATE_REPO }}
          APP_UPDATE_TOKEN: ${{ secrets.APP_UPDATE_TOKEN }}
          APP_GITHUB_SHA: ${{ github.sha }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QPby64-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: QPby64-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
