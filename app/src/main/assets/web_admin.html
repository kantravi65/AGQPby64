<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Exam Monitor - Supervisor Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; }
        header { background-color: #0f172a; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 20px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; padding: 20px; }
        .candidate-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .video-container { width: 100%; height: 200px; background-color: #000; display: flex; align-items: center; justify-content: center; position: relative; }

        .video-container video { width: 100%; height: 100%; object-fit: cover; background: #000; }
        .audio-controls { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6); padding: 5px; border-radius: 5px; color: white; display: flex; gap: 10px; }
        .audio-controls button { padding: 4px 8px; font-size: 12px; background: #475569; color: white; border: none; border-radius: 3px; cursor: pointer; }

        .no-feed { color: #666; font-size: 14px; }
        .candidate-info { padding: 15px; flex-grow: 1; }
        .name { font-weight: bold; font-size: 18px; margin-bottom: 5px; color: #1e293b; }
        .roll { color: #64748b; font-size: 14px; margin-bottom: 10px; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-testing { background-color: #fef3c7; color: #d97706; }
        .status-submitted { background-color: #d1fae5; color: #047857; }
        .status-disqualified { background-color: #fee2e2; color: #b91c1c; }
        .details { margin-top: 15px; font-size: 13px; color: #475569; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .actions { padding: 15px; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; }
        button { padding: 8px 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; transition: opacity 0.2s; }
        button:hover:not(:disabled) { opacity: 0.9; }
        button:disabled, button[disabled], .btn-disabled {
            opacity: 0.35 !important;
            cursor: not-allowed !important;
            pointer-events: none !important;
            background-color: #475569 !important;
            color: #94a3b8 !important;
            box-shadow: none !important;
            filter: grayscale(100%) !important;
        }
        .btn-warn { background-color: #f59e0b; color: white; }
        .btn-dispatch { background-color: #3b82f6; color: white; }
        .btn-dispatched { background-color: #10b981; color: white; cursor: not-allowed; }
        .live-indicator { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; }
        .dot { width: 10px; height: 10px; background-color: #10b981; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        .stats-bar { padding: 10px 20px; background: white; border-bottom: 1px solid #e2e8f0; display: flex; gap: 20px; font-size: 14px; color: #475569; }
    </style>
</head>
<body>
    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <h1>Live Exam Web Monitor</h1>
            <button id="btnCompileDispatchAll" onclick="compileAndDispatchAll()" class="btn-disabled" style="padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; background-color: #475569; color: #94a3b8; border: none; cursor: not-allowed; opacity: 0.35; pointer-events: none; transition: all 0.2s; filter: grayscale(100%);" disabled title="Grayed out until test is completed">
                ⏳ Compile & Dispatch (Exam In Progress)
            </button>
        </div>
        <div class="live-indicator"><div class="dot"></div> SERVER ACTIVE</div>
    </header>
    <div class="stats-bar" id="statsBar">
        Loading statistics...
    </div>
    
    <div class="grid-container" id="candidateGrid">
        <!-- Candidate Cards will be injected here -->
    </div>

    <script>

        const config = { 
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun.cloudflare.com:3478' },
                {
                    urls: [
                        'turn:openrelay.metered.ca:80',
                        'turn:openrelay.metered.ca:443',
                        'turn:openrelay.metered.ca:443?transport=tcp'
                    ],
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                }
            ]
        };
        const peerConnections = {};
        const knownCandidates = new Set();
        let adminWs = null;

        function connectWs() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            adminWs = new WebSocket(proto + '//' + location.host + '/api/admin/ws');
            
            adminWs.onmessage = async (event) => {
                const msg = event.data;
                const parts = msg.split(':');
                if (parts[0] === 'WEBRTC_ANSWER' && parts.length >= 3) {
                    const rollNumber = parts[1];
                    const sdp = JSON.parse(atob(parts.slice(2).join(':')));
                    const pc = peerConnections[rollNumber];
                    if (pc) {
                        await pc.setRemoteDescription(new RTCSessionDescription(sdp));
                    }
                } else if (parts[0] === 'WEBRTC_ICE' && parts.length >= 3) {
                    const rollNumber = parts[1];
                    const ice = JSON.parse(atob(parts.slice(2).join(':')));
                    const pc = peerConnections[rollNumber];
                    if (pc) {
                        await pc.addIceCandidate(new RTCIceCandidate(ice)).catch(e => console.warn(e));
                    }
                } else if (parts[0] === 'FRAME_UPDATE' && parts.length >= 3) {
                    const rollNumber = parts[1];
                    const b64 = parts.slice(2).join(':');
                    const videoEl = document.getElementById('video-' + rollNumber);
                    const imgEl = document.getElementById('image-' + rollNumber);
                    const badge = document.getElementById('feed-badge-' + rollNumber);
                    if (imgEl && (!videoEl || videoEl.style.display !== 'block')) {
                        imgEl.src = b64;
                        imgEl.style.display = 'block';
                        if (badge && badge.innerText !== '● LIVE AV') {
                            badge.innerText = '● LIVE CAM';
                            badge.style.color = '#38bdf8';
                        }
                    }
                } else if (parts[0] === 'CANDIDATE_WS_READY' && parts.length >= 2) {
                    const rollNumber = parts[1];
                    console.log("Candidate WS ready, initiating WebRTC for", rollNumber);
                    startWebRtc(rollNumber);
                } else if (msg === 'CANDIDATE_UPDATE') {
                    fetchCandidates();
                }
            };
            
            adminWs.onclose = () => {
                setTimeout(connectWs, 2000);
            };
        }
        connectWs();

        function startWebRtc(rollNumber) {
            if (peerConnections[rollNumber]) {
                try { peerConnections[rollNumber].close(); } catch(e){}
            }
            
            const pc = new RTCPeerConnection(config);
            peerConnections[rollNumber] = pc;
            
            try {
                pc.addTransceiver('video', { direction: 'recvonly' });
                pc.addTransceiver('audio', { direction: 'recvonly' });
            } catch (e) {
                console.warn("Transceiver not supported, falling back to legacy offerToReceive", e);
            }
            
            pc.ontrack = event => {
                const videoEl = document.getElementById('video-' + rollNumber);
                const imgEl = document.getElementById('image-' + rollNumber);
                const badge = document.getElementById('feed-badge-' + rollNumber);
                if (videoEl && event.streams && event.streams[0]) {
                    videoEl.srcObject = event.streams[0];
                    videoEl.style.display = 'block';
                    videoEl.play().catch(e => console.log("WebRTC video play:", e));
                    if (imgEl) imgEl.style.display = 'none';
                    if (badge) {
                        badge.innerText = '● LIVE AV';
                        badge.style.color = '#10b981';
                    }
                }
            };
            
            pc.onicecandidate = event => {
                if (event.candidate && adminWs && adminWs.readyState === WebSocket.OPEN) {
                    adminWs.send("WEBRTC_ICE:" + rollNumber + ":" + btoa(JSON.stringify(event.candidate)));
                }
            };
            
            pc.createOffer({offerToReceiveVideo: true, offerToReceiveAudio: true}).then(offer => {
                return pc.setLocalDescription(offer).then(() => {
                    if (adminWs && adminWs.readyState === WebSocket.OPEN) {
                        adminWs.send("WEBRTC_OFFER:" + rollNumber + ":" + btoa(JSON.stringify(offer)));
                    } else {
                        setTimeout(() => {
                            if (adminWs && adminWs.readyState === WebSocket.OPEN) {
                                adminWs.send("WEBRTC_OFFER:" + rollNumber + ":" + btoa(JSON.stringify(offer)));
                            }
                        }, 1000);
                    }
                });
            }).catch(err => {
                console.error("Failed to create WebRTC offer:", err);
            });
        }

        function toggleAudio(rollNumber) {
            const videoEl = document.getElementById('video-' + rollNumber);
            if (videoEl) {
                videoEl.muted = !videoEl.muted;
                document.getElementById('btn-mute-' + rollNumber).innerText = videoEl.muted ? 'Unmute' : 'Mute';
            }
        }
        
        function toggleFullscreen(rollNumber) {
            const videoEl = document.getElementById('video-' + rollNumber);
            if (videoEl) {
                if (videoEl.requestFullscreen) {
                    videoEl.requestFullscreen();
                } else if (videoEl.webkitRequestFullscreen) {
                    videoEl.webkitRequestFullscreen();
                }
            }
        }

        async function fetchCandidates() {

            try {
                const response = await fetch('/api/admin/status');
                if (response.status === 401) {
                    // Browser will prompt for auth
                    return;
                }
                const candidates = await response.json();
                renderGrid(candidates);
                updateStats(candidates);
            } catch (err) {
                console.error("Failed to fetch status", err);
            }
        }

        function getStatusClass(status) {
            if (status === 'Testing') return 'status-testing';
            if (status === 'Disqualified') return 'status-disqualified';
            return 'status-submitted';
        }

        function getCandidateProgress(c) {
            let totalQuestions = 0;
            let answeredQuestions = 0;
            try {
                if (c.questionsJson) {
                    const questions = JSON.parse(c.questionsJson);
                    if (Array.isArray(questions)) {
                        totalQuestions = questions.length;
                    }
                }
            } catch (e) {
                console.error("Error parsing questionsJson", e);
            }
            
            try {
                if (c.answersJson) {
                    const answers = JSON.parse(c.answersJson);
                    if (answers && typeof answers === 'object') {
                        answeredQuestions = Object.values(answers).filter(val => val !== undefined && val !== null && val.toString().trim() !== "").length;
                    }
                }
            } catch (e) {
                console.error("Error parsing answersJson", e);
            }
            
            return { answered: answeredQuestions, total: totalQuestions };
        }

        function renderGrid(candidates) {
            window.lastCandidates = candidates;
            const grid = document.getElementById('candidateGrid');
            const activeCount = candidates.filter(c => (c.status || '').toLowerCase() === 'testing').length;
            const isExamUnderProgress = activeCount > 0;
            
            if (candidates.length === 0 && knownCandidates.size === 0) {
                grid.innerHTML = '<div style="padding: 20px; color: #64748b;">No active candidates. Waiting for logins...</div>';
                return;
            } else if (knownCandidates.size === 0 && candidates.length > 0) {
                grid.innerHTML = '';
            }
            
            candidates.forEach(c => {
                const roll = c.rollNumber;
                const isDispatched = c.isDispatched;
                const statusCls = getStatusClass(c.status);
                
                if (!knownCandidates.has(roll)) {
                    knownCandidates.add(roll);
                    
                    const card = document.createElement('div');
                    card.className = 'candidate-card';
                    card.id = 'card-' + roll;
                    
                    card.innerHTML = `
                        <div class="video-container">
                            <div id="feed-badge-${roll}" style="position: absolute; top: 8px; left: 8px; z-index: 10; background: rgba(0,0,0,0.65); color: #f59e0b; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px;">● CONNECTING</div>
                            <video id="video-${roll}" autoplay playsinline muted style="width: 100%; height: 100%; object-fit: cover; display: none;"></video>
                            <img id="image-${roll}" style="width: 100%; height: 100%; object-fit: cover; display: block;" src="${c.latestFrameBase64 || c.portraitBase64 || ''}">
                            <div class="audio-controls">
                                <button id="btn-mute-${roll}" onclick="toggleAudio('${roll}')">Unmute</button>
                                <button onclick="toggleFullscreen('${roll}')">Fullscreen</button>
                            </div>
                        </div>
                        <div class="candidate-info">
                            <div class="name">${c.name}</div>
                            <div class="roll">${roll}</div>
                            <span id="badge-${roll}" class="status-badge ${statusCls}">${c.status}</span>
                            
                            <div class="details">
                                <div id="score-${roll}"><b>Score:</b> ${c.score}/${c.totalMarks}</div>
                                <div id="warn-${roll}"><b>Warnings:</b> ${c.warningCount}/3</div>
                                <div id="progress-${roll}"><b>Progress:</b> 0/0</div>
                                <div id="current-q-${roll}"><b>On Question:</b> N/A</div>
                                <div style="grid-column: span 2;"><b>Contact:</b> ${c.mobile || 'N/A'}</div>
                            </div>
                        </div>
                        <div class="actions" id="actions-${roll}">
                        </div>
                    `;
                    grid.appendChild(card);
                    
                    // Start WebRTC connection for this candidate
                    startWebRtc(roll);
                }
                
                // Update dynamic values
                document.getElementById('badge-' + roll).className = `status-badge ${statusCls}`;
                document.getElementById('badge-' + roll).innerText = c.status;
                document.getElementById('score-' + roll).innerHTML = `<b>Score:</b> ${c.score}/${c.totalMarks}`;
                document.getElementById('warn-' + roll).innerHTML = `<b>Warnings:</b> ${c.warningCount}/3`;
                
                const progressInfo = getCandidateProgress(c);
                document.getElementById('progress-' + roll).innerHTML = `<b>Progress:</b> ${progressInfo.answered}/${progressInfo.total} Ans`;
                document.getElementById('current-q-' + roll).innerHTML = `<b>On Question:</b> ${c.currentQuestionId || 'N/A'}`;
                
                // Update fallback image
                const imgEl = document.getElementById('image-' + roll);
                const videoEl = document.getElementById('video-' + roll);
                if (imgEl && (!videoEl || videoEl.style.display !== 'block')) {
                    const src = c.latestFrameBase64 || c.portraitBase64 || '';
                    if (src) {
                        imgEl.src = src;
                        imgEl.style.display = 'block';
                    } else {
                        imgEl.style.display = 'none';
                    }
                }

                const actionsEl = document.getElementById('actions-' + roll);
                const isTesting = (c.status || '').toLowerCase() === 'testing';
                if (isTesting) {
                    actionsEl.innerHTML = `
                        <button class="btn-warn" onclick="issueWarning('${roll}')">⚠️ Issue Warning</button>
                        <button class="btn-dispatch btn-disabled" disabled style="opacity: 0.35 !important; cursor: not-allowed !important; pointer-events: none !important; background-color: #475569 !important; color: #94a3b8 !important;" title="Option grayed out while test is in progress">⏳ Testing...</button>
                    `;
                } else if (isDispatched) {
                    actionsEl.innerHTML = `<button class="btn-dispatched" disabled style="opacity: 0.7; cursor: default;">✓ Dispatched</button>`;
                } else if (isExamUnderProgress) {
                    actionsEl.innerHTML = `
                        <button class="btn-dispatch btn-disabled" disabled style="opacity: 0.35 !important; cursor: not-allowed !important; pointer-events: none !important; background-color: #475569 !important; color: #94a3b8 !important;" title="Option grayed out: other candidates are still taking the test (${activeCount} active)">⏳ Wait for Test End</button>
                    `;
                } else {
                    actionsEl.innerHTML = `<button class="btn-dispatch" onclick="dispatchResult('${roll}')">📤 Dispatch & SMS</button>`;
                }
            });
        }
        
        function updateStats(candidates) {
            const total = candidates.length;
            const active = candidates.filter(c => (c.status || '').toLowerCase() === 'testing').length;
            const submitted = candidates.filter(c => (c.status || '').toLowerCase() === 'submitted').length;
            const disqualified = candidates.filter(c => (c.status || '').toLowerCase() === 'disqualified').length;
            
            document.getElementById('statsBar').innerHTML = `
                <div><b>Total Connections:</b> ${total}</div>
                <div><b>Active Testing:</b> <span style="color: ${active > 0 ? '#d97706' : '#10b981'}; font-weight: bold;">${active}</span></div>
                <div><b>Submitted:</b> ${submitted}</div>
                <div><b>Disqualified:</b> ${disqualified}</div>
            `;

            const compileBtn = document.getElementById('btnCompileDispatchAll');
            if (compileBtn) {
                const isTestingOngoing = total === 0 || active > 0;
                if (!isTestingOngoing) {
                    compileBtn.disabled = false;
                    compileBtn.classList.remove('btn-disabled');
                    compileBtn.style.setProperty('opacity', '1', 'important');
                    compileBtn.style.setProperty('cursor', 'pointer', 'important');
                    compileBtn.style.setProperty('pointer-events', 'auto', 'important');
                    compileBtn.style.setProperty('background-color', '#10b981', 'important');
                    compileBtn.style.setProperty('color', '#ffffff', 'important');
                    compileBtn.style.setProperty('filter', 'none', 'important');
                    compileBtn.innerText = '✓ Compile & Dispatch Results';
                    compileBtn.title = 'All tests completed. Click to compile and dispatch results.';
                } else {
                    compileBtn.disabled = true;
                    compileBtn.classList.add('btn-disabled');
                    compileBtn.style.setProperty('opacity', '0.35', 'important');
                    compileBtn.style.setProperty('cursor', 'not-allowed', 'important');
                    compileBtn.style.setProperty('pointer-events', 'none', 'important');
                    compileBtn.style.setProperty('background-color', '#475569', 'important');
                    compileBtn.style.setProperty('color', '#94a3b8', 'important');
                    compileBtn.style.setProperty('filter', 'grayscale(100%)', 'important');
                    compileBtn.innerText = active > 0 ? `⏳ Compile & Dispatch (${active} Testing...)` : '⏳ Compile & Dispatch (Exam In Progress)';
                    compileBtn.title = active > 0 ? `Grayed out: ${active} candidate(s) still taking test.` : 'Grayed out: Test is currently in progress or waiting for candidates.';
                }
            }
        }

        let modalCallback = null;
        function showCustomConfirm(title, message, callback) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMsg').innerText = message;
            document.getElementById('modalInputContainer').style.display = 'none';
            document.getElementById('modalBtnCancel').style.display = 'block';
            document.getElementById('modalBtnConfirm').innerText = 'Confirm';
            document.getElementById('modalBtnConfirm').className = 'btn-dispatch';
            document.getElementById('customModal').style.display = 'flex';
            modalCallback = callback;
        }

        function showCustomPrompt(title, message, placeholder, callback) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMsg').innerText = message;
            document.getElementById('modalInputContainer').style.display = 'block';
            document.getElementById('modalInput').value = '';
            document.getElementById('modalInput').placeholder = placeholder;
            document.getElementById('modalBtnCancel').style.display = 'block';
            document.getElementById('modalBtnConfirm').innerText = 'Send Warning';
            document.getElementById('modalBtnConfirm').className = 'btn-warn';
            document.getElementById('customModal').style.display = 'flex';
            modalCallback = callback;
            setTimeout(() => document.getElementById('modalInput').focus(), 100);
        }

        function showCustomAlert(title, message) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMsg').innerText = message;
            document.getElementById('modalInputContainer').style.display = 'none';
            document.getElementById('modalBtnCancel').style.display = 'none';
            document.getElementById('modalBtnConfirm').innerText = 'OK';
            document.getElementById('modalBtnConfirm').className = 'btn-dispatch';
            document.getElementById('customModal').style.display = 'flex';
            modalCallback = () => {};
        }

        function closeCustomModal(confirmed) {
            document.getElementById('customModal').style.display = 'none';
            if (modalCallback) {
                if (document.getElementById('modalInputContainer').style.display === 'block') {
                    const val = document.getElementById('modalInput').value;
                    modalCallback(confirmed ? val : null);
                } else {
                    modalCallback(confirmed);
                }
                modalCallback = null;
            }
        }

        async function issueWarning(roll) {
            showCustomPrompt("⚠️ Issue Warning", `Enter warning message for candidate (Roll: ${roll}):`, "e.g., Please turn on your desk light or stop talking.", async (msg) => {
                if (!msg) return;
                try {
                    const response = await fetch('/api/admin/warn', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ rollNumber: roll, message: msg })
                    });
                    if (response.ok) {
                        showCustomAlert("Success", "Warning sent successfully!");
                    } else {
                        showCustomAlert("Error", "Failed to send warning.");
                    }
                } catch (e) {
                    showCustomAlert("Error", "Failed to send warning.");
                }
            });
        }

        async function dispatchResult(roll) {
            const activeCount = (window.lastCandidates || []).filter(c => (c.status || '').toLowerCase() === 'testing').length;
            if (activeCount > 0) {
                showCustomAlert("Action Restricted", `Cannot dispatch results while test is under progress (${activeCount} candidate(s) still testing). Please wait until all candidates finish.`);
                return;
            }
            showCustomConfirm("📤 Dispatch Result", `Are you sure you want to finalize and dispatch results for Candidate ${roll}? This will send an SMS to their mobile.`, async (confirmed) => {
                if (!confirmed) return;
                try {
                    const response = await fetch('/api/admin/dispatch', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ rollNumber: roll })
                    });
                    if (response.ok) {
                        showCustomAlert("Success", "Result finalized and dispatched!");
                    } else {
                        showCustomAlert("Error", "Failed to dispatch result.");
                    }
                } catch (e) {
                    showCustomAlert("Error", "Failed to dispatch result.");
                }
            });
        }

        async function compileAndDispatchAll() {
            const compileBtn = document.getElementById('btnCompileDispatchAll');
            if (compileBtn && (compileBtn.disabled || compileBtn.classList.contains('btn-disabled'))) {
                return;
            }
            showCustomConfirm("📋 Compile & Dispatch Results", "All candidates have finished testing. Are you sure you want to finalize and dispatch results & SMS to all eligible candidates?", async (confirmed) => {
                if (!confirmed) return;
                try {
                    const response = await fetch('/api/admin/dispatch-all', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    if (response.ok) {
                        const data = await response.json();
                        showCustomAlert("Success", `Compiled and dispatched results to ${data.dispatchedCount || 0} candidate(s)!`);
                        fetchCandidates();
                    } else {
                        const err = await response.text();
                        showCustomAlert("Error", err || "Failed to dispatch results.");
                    }
                } catch (e) {
                    showCustomAlert("Error", "Network communication error.");
                }
            });
        }

        // Start heartbeat polling
        setInterval(fetchCandidates, 2000);
        fetchCandidates();
    </script>

    <!-- Custom Modern Modals to replace standard blocking browser dialogs (improving WebView compatibility) -->
    <div id="customModal" style="display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.6); align-items: center; justify-content: center; backdrop-filter: blur(4px);">
        <div style="background-color: white; padding: 25px; border-radius: 12px; max-width: 400px; width: 90%; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1); font-family: inherit;">
            <h3 id="modalTitle" style="margin-top: 0; margin-bottom: 10px; color: #0f172a; font-size: 18px;">Confirm Action</h3>
            <p id="modalMsg" style="color: #475569; font-size: 14px; margin-bottom: 20px; line-height: 1.5;"></p>
            <div id="modalInputContainer" style="margin-bottom: 20px; display: none;">
                <input type="text" id="modalInput" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px;" placeholder="Type here...">
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button id="modalBtnCancel" style="padding: 10px 20px; border: 1px solid #cbd5e1; background: white; color: #475569; border-radius: 6px; font-weight: bold; cursor: pointer; flex: none; width: auto;" onclick="closeCustomModal(false)">Cancel</button>
                <button id="modalBtnConfirm" style="padding: 10px 20px; border: none; background: #3b82f6; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; flex: none; width: auto;" onclick="closeCustomModal(true)">Confirm</button>
            </div>
        </div>
    </div>
</body>
</html>
