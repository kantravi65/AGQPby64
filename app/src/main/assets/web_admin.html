<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Exam Monitor - Supervisor Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 0; }
        header { background-color: #1e293b; color: white; padding: 16px 28px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        h1 { margin: 0; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; padding: 24px; }
        .candidate-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); display: flex; flex-direction: column; transition: transform 0.2s, border-color 0.2s; }
        .candidate-card:hover { border-color: #475569; transform: translateY(-2px); }
        .video-container { width: 100%; height: 210px; background-color: #000; display: flex; align-items: center; justify-content: center; position: relative; }
        .video-container img { width: 100%; height: 100%; object-fit: cover; }
        .no-feed { color: #64748b; font-size: 13px; font-weight: 500; }
        .live-tag { position: absolute; top: 10px; left: 10px; background: rgba(16, 185, 129, 0.9); color: white; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 4px; display: flex; align-items: center; gap: 5px; }
        .live-tag-dot { width: 6px; height: 6px; background: white; border-radius: 50%; animation: pulse 1.5s infinite; }
        .candidate-info { padding: 16px; flex-grow: 1; }
        .name-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .name { font-weight: bold; font-size: 17px; color: #f1f5f9; }
        .roll { color: #94a3b8; font-size: 13px; margin-bottom: 12px; font-family: monospace; }
        .status-badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .status-testing { background-color: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
        .status-submitted { background-color: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
        .status-disqualified { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
        .strike-pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .strike-0 { background: #064e3b; color: #6ee7b7; }
        .strike-warn { background: #78350f; color: #fde68a; }
        .strike-danger { background: #7f1d1d; color: #fca5a5; }
        .details-grid { margin-top: 12px; font-size: 13px; color: #cbd5e1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #0f172a; padding: 10px; border-radius: 8px; }
        .actions { padding: 12px 16px; background: #0f172a; border-top: 1px solid #334155; display: flex; flex-wrap: wrap; gap: 8px; }
        button { padding: 7px 12px; border: none; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; transition: all 0.2s; flex: 1; min-width: 90px; }
        button:hover { opacity: 0.9; }
        .btn-warn { background-color: #f59e0b; color: #000; }
        .btn-pardon { background-color: #10b981; color: #000; }
        .btn-force { background-color: #ef4444; color: #fff; }
        .btn-logs { background-color: #6366f1; color: #fff; }
        .btn-dispatch { background-color: #3b82f6; color: white; }
        .btn-dispatched { background-color: #334155; color: #94a3b8; cursor: not-allowed; }
        .live-indicator { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: bold; color: #34d399; }
        .dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        .stats-bar { padding: 12px 28px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; flex-wrap: wrap; gap: 24px; font-size: 13px; color: #94a3b8; }
        .stats-bar b { color: #f8fafc; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; align-items: center; justify-content: center; }
        .modal-content { background: #1e293b; border: 1px solid #334155; border-radius: 12px; max-width: 600px; width: 90%; max-height: 80vh; display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { padding: 16px 20px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; overflow-y: auto; flex-grow: 1; }
        .modal-footer { padding: 12px 20px; background: #0f172a; border-top: 1px solid #334155; text-align: right; }
        .log-entry { padding: 10px; margin-bottom: 8px; border-radius: 6px; background: #0f172a; border-left: 4px solid #f59e0b; font-size: 13px; }
        .log-time { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    </style>
</head>
<body>
    <header>
        <h1><span>🛡️</span> Live Exam Supervisor Monitor</h1>
        <div class="live-indicator"><div class="dot"></div> PROCTOR STREAM ACTIVE</div>
    </header>
    <div class="stats-bar" id="statsBar">
        Loading exam statistics...
    </div>
    
    <div class="grid-container" id="candidateGrid">
        <!-- Candidate Cards injected here -->
    </div>

    <!-- VIOLATION LOGS MODAL -->
    <div id="logsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin:0; font-size:16px;" id="modalTitle">Candidate Audit Log</h3>
                <button onclick="closeModal()" style="background:transparent; border:none; color:#94a3b8; font-size:20px; cursor:pointer; min-width:auto; padding:0;">&times;</button>
            </div>
            <div class="modal-body" id="modalLogs">
                <!-- Logs rendered here -->
            </div>
            <div class="modal-footer">
                <button onclick="closeModal()" style="background:#334155; color:white; min-width:80px;">Close</button>
            </div>
        </div>
    </div>

    <script>
        let cachedCandidates = [];

        async function fetchCandidates() {
            try {
                const response = await fetch('/api/admin/status');
                if (response.status === 401) return;
                const candidates = await response.json();
                cachedCandidates = candidates;
                renderGrid(candidates);
                updateStats(candidates);
            } catch (err) {
                console.error("Failed to fetch status", err);
            }
        }

        function getStatusClass(status) {
            if (status === 'Testing') return 'status-testing';
            if (status === 'Disqualified') return 'status-disqualified';
            return 'status-submitted';
        }

        function getStrikeBadge(warnings) {
            if (warnings === 0) return `<span class="strike-pill strike-0">✓ 0 Strikes</span>`;
            if (warnings < 3) return `<span class="strike-pill strike-warn">⚠️ ${warnings} Strikes</span>`;
            return `<span class="strike-pill strike-danger">🛑 ${warnings} Strikes</span>`;
        }

        function renderGrid(candidates) {
            const grid = document.getElementById('candidateGrid');
            if (candidates.length === 0) {
                grid.innerHTML = '<div style="padding: 40px; color: #64748b; grid-column: 1 / -1; text-align: center;">No active candidates logged in yet. Waiting for entrance...</div>';
                return;
            }
            
            let html = '';
            candidates.forEach(c => {
                const isDispatched = c.isDispatched;
                const frame = c.latestFrameBase64 || c.portraitBase64 || null;
                const statusCls = getStatusClass(c.status);
                const strikeBadge = getStrikeBadge(c.warningCount);
                
                html += `
                    <div class="candidate-card">
                        <div class="video-container">
                            ${frame ? `<img src="${frame}" alt="Live Feed">` : `<div class="no-feed">NO CAMERA FEED</div>`}
                            <div class="live-tag"><div class="live-tag-dot"></div> LIVE</div>
                        </div>
                        <div class="candidate-info">
                            <div class="name-row">
                                <div class="name">${c.name}</div>
                                <span class="status-badge ${statusCls}">${c.status}</span>
                            </div>
                            <div class="roll">${c.rollNumber}</div>
                            
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                                ${strikeBadge}
                                <button class="btn-logs" style="flex:0; padding:3px 8px; font-size:11px;" onclick="viewLogs('${c.rollNumber}')">📜 Audit Logs</button>
                            </div>

                            <div class="details-grid">
                                <div><b>Score:</b> ${c.score}/${c.totalMarks}</div>
                                <div><b>Questions:</b> ${c.totalMarks > 0 ? 'Assigned' : 'Loading'}</div>
                                <div style="grid-column: span 2;"><b>Contact:</b> ${c.mobile || c.email || 'N/A'}</div>
                            </div>
                        </div>
                        <div class="actions">
                            ${c.status === 'Testing' ? `
                                <button class="btn-warn" onclick="issueWarning('${c.rollNumber}')">⚠️ Warn</button>
                                <button class="btn-pardon" onclick="pardonCandidate('${c.rollNumber}')">🔄 Pardon</button>
                                <button class="btn-force" onclick="forceSubmit('${c.rollNumber}')">🛑 Disqualify</button>
                            ` : (isDispatched ? 
                                `<button class="btn-dispatched" disabled>✓ Marksheet Dispatched</button>` : 
                                `<button class="btn-dispatch" onclick="dispatchResult('${c.rollNumber}')">📤 Dispatch & SMS</button>`
                            )}
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }
        
        function updateStats(candidates) {
            const total = candidates.length;
            const active = candidates.filter(c => c.status === 'Testing').length;
            const submitted = candidates.filter(c => c.status === 'Submitted').length;
            const disqualified = candidates.filter(c => c.status === 'Disqualified').length;
            
            document.getElementById('statsBar').innerHTML = `
                <div>Total Candidates: <b>${total}</b></div>
                <div>Active in Exam: <b>${active}</b></div>
                <div>Submitted: <b>${submitted}</b></div>
                <div>Disqualified: <b>${disqualified}</b></div>
            `;
        }

        async function issueWarning(roll) {
            const msg = prompt("Enter warning alert message for candidate:");
            if (!msg) return;
            try {
                await fetch('/api/admin/warn', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rollNumber: roll, message: msg })
                });
                alert("Warning sent to candidate!");
            } catch (e) {
                alert("Failed to send warning.");
            }
        }

        async function pardonCandidate(roll) {
            if (!confirm(`Reset strikes and pardon candidate (Roll: ${roll})?`)) return;
            try {
                await fetch('/api/admin/pardon', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rollNumber: roll })
                });
                fetchCandidates();
            } catch (e) {
                alert("Failed to pardon strikes.");
            }
        }

        async function forceSubmit(roll) {
            if (!confirm(`Are you sure you want to force terminate and disqualify candidate (Roll: ${roll})?`)) return;
            try {
                await fetch('/api/admin/force-submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rollNumber: roll })
                });
                fetchCandidates();
            } catch (e) {
                alert("Failed to force submit.");
            }
        }

        async function dispatchResult(roll) {
            if (!confirm("Are you sure you want to finalize and dispatch this result via SMS?")) return;
            try {
                await fetch('/api/admin/dispatch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rollNumber: roll })
                });
                fetchCandidates();
            } catch (e) {
                alert("Failed to dispatch.");
            }
        }

        function viewLogs(roll) {
            const candidate = cachedCandidates.find(c => c.rollNumber === roll);
            if (!candidate) return;

            document.getElementById('modalTitle').innerText = `Security Audit Log: ${candidate.name} (${candidate.rollNumber})`;
            let logs = [];
            try {
                logs = JSON.parse(candidate.violationsJson || '[]');
            } catch(e) {}

            const logsDiv = document.getElementById('modalLogs');
            if (logs.length === 0) {
                logsDiv.innerHTML = '<div style="color: #64748b; text-align: center; padding: 20px;">No security violations recorded for this candidate. Clean session!</div>';
            } else {
                let html = '';
                logs.forEach((log, i) => {
                    const time = new Date(log.timestamp).toLocaleTimeString();
                    html += `
                        <div class="log-entry">
                            <div class="log-time">#${i+1} • ${time} • <b>${log.type}</b></div>
                            <div>${log.details || 'Violation detected'}</div>
                        </div>
                    `;
                });
                logsDiv.innerHTML = html;
            }

            document.getElementById('logsModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('logsModal').style.display = 'none';
        }

        // Start heartbeat polling
        setInterval(fetchCandidates, 2500);
        fetchCandidates();
    </script>
</body>
</html>
